# =============================================================================
# Virvi V2 — Single Mode (self-hosted, one server)
#
# Everything runs from one container + Postgres.
# No Redis, no external storage required.
#
# Usage:
#   cp .env.example .env   # edit DATABASE_URL and JWT_SECRET
#   docker compose -f docker-compose.single.yml up -d
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432" # this machine only; Docker publishing skips host firewalls
    environment:
      POSTGRES_DB: vlm  # virvi-rename: keep (local database name)
      POSTGRES_USER: vlm  # virvi-rename: keep (local database name)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vlm_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlm"]  # virvi-rename: keep
      interval: 10s
      timeout: 5s
      retries: 5

  virvi:
    build:
      context: .
      # The dashboard is built with its API address inlined (Next.js NEXT_PUBLIC_*): PUBLIC_URL from .env, so a server
      # on a real domain doesn't get a dashboard that calls localhost. NEXT_PUBLIC_WSS_URL: wss://<your domain>
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${PUBLIC_URL:-http://localhost:3010}}
        NEXT_PUBLIC_WSS_URL: ${NEXT_PUBLIC_WSS_URL:-ws://localhost:3010}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    ports:
      - "${PORT:-3010}:3010"
    depends_on:
      postgres:
        condition: service_healthy
    # Everything in .env reaches the server (SMTP, OAuth, TRUST_PROXY_HOPS...); the lines below win over it.
    env_file: .env
    environment:
      VIRVI_MODE: single
      DATABASE_URL: postgresql://vlm:${POSTGRES_PASSWORD:-vlm_prod}@postgres:5432/vlm
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3010}
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/uploads
      PRIVATE_STORAGE_PATH: /app/private
      PORT: 3010 # the container's port; PORT in .env is the host port
    volumes:
      - uploads:/app/uploads
      - private:/app/private

volumes:
  pgdata:
  uploads:
  private:
