services:
  - type: web
    name: virvi
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: VIRVI_MODE
        value: single
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Uploads and private files live on the disk below, so they survive deploys and restarts.
      # For S3/R2 instead, set STORAGE_PROVIDER=s3 with S3_BUCKET, S3_ENDPOINT and the AWS_* keys.
      - key: LOCAL_STORAGE_PATH
        value: /app/data/uploads
    disk:
      name: virvi-data
      mountPath: /app/data
      sizeGB: 10
